AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  S3 ZIP archiver - compresses every new object uploaded to the archive
  bucket into a ZIP file in the same bucket and removes the original.

Parameters:
  SourcePrefix:
    Type: String
    Default: incoming/
    AllowedPattern: "^[^/].*/$"
    Description: Key prefix that triggers archiving. Must end with "/".
  ArchivePrefix:
    Type: String
    Default: archived/
    AllowedPattern: "^[^/].*/$"
    Description: >
      Key prefix the ZIP archives are written to. Must not overlap with
      SourcePrefix, otherwise archives would re-trigger the function.
  CompressionLevel:
    Type: Number
    Default: 6
    MinValue: 0
    MaxValue: 9
    Description: zlib level (1 = fastest, 9 = smallest). 6 is the usual sweet spot.
  ArchiveStorageClass:
    Type: String
    Default: STANDARD
    AllowedValues: [STANDARD, STANDARD_IA, ONEZONE_IA, INTELLIGENT_TIERING, GLACIER_IR, GLACIER, DEEP_ARCHIVE]
    Description: Storage class the ZIP archives are written with.
  ApplicationLogLevel:
    Type: String
    Default: INFO
    AllowedValues: [TRACE, DEBUG, INFO, WARN, ERROR, FATAL]
    Description: >
      Minimum application log level. At millions of invocations per hour,
      WARN avoids paying CloudWatch ingestion for one line per archived file.
  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
  AlarmTopicArn:
    Type: String
    Default: ""
    Description: Optional SNS topic notified when events land in the failure queue.
  VpcCidr:
    Type: String
    Default: 10.20.0.0/16
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  PrivateSubnetACidr:
    Type: String
    Default: 10.20.0.0/19
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
  PrivateSubnetBCidr:
    Type: String
    Default: 10.20.32.0/19
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmTopicArn, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # Network: a VPC with private subnets only. There is no internet gateway or
  # NAT gateway; the function reaches S3 through a (free) gateway endpoint.
  # ---------------------------------------------------------------------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-vpc

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-a

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private-b

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-private

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      RouteTableIds:
        - !Ref PrivateRouteTable
      # Only the archive bucket is reachable from inside the VPC.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ArchiveBucketOnly
            Effect: Allow
            Principal: "*"
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:AbortMultipartUpload
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/*

  ArchiverSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Archiver Lambda - no inbound, HTTPS outbound only
      VpcId: !Ref Vpc
      # The route table only has the local route and the S3 prefix list, so
      # HTTPS egress can only reach S3 through the gateway endpoint.
      SecurityGroupEgress:
        - Description: HTTPS to S3 via the gateway endpoint
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  # ---------------------------------------------------------------------------
  # Storage and compute
  # ---------------------------------------------------------------------------
  ArchiveBucket:
    Type: AWS::S3::Bucket
    Properties:
      # The name is computed rather than referenced with !Ref from the
      # function policy: the bucket's notification configuration already
      # depends on the function, so a !Ref back would be circular.
      BucketName: !Sub ${AWS::StackName}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          # A timeout mid-upload leaves parts behind that are billed as storage.
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub ${ArchiveBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  ArchiverFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: Compresses new S3 objects into ZIP archives and deletes the originals
      PackageType: Image
      Architectures: [arm64]
      MemorySize: 1024
      Timeout: 60
      # Every deployment that changes the image or any function property
      # publishes an immutable version and moves the "live" alias to it. The
      # S3 trigger invokes the alias, so rolling back is a single alias update
      # (see scripts/rollback.sh).
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      # SAM also attaches AWSLambdaVPCAccessExecutionRole so Lambda can manage
      # the function's network interfaces.
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnetA
          - !Ref PrivateSubnetB
        SecurityGroupIds:
          - !Ref ArchiverSecurityGroup
      # JSON logs keep the structured fields queryable. SystemLogLevel WARN
      # drops the START/END/REPORT lines emitted for every invocation.
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: !Ref ApplicationLogLevel
        SystemLogLevel: WARN
        LogGroup: !Ref ArchiverLogGroup
      # S3 invokes asynchronously: retry transient failures twice, then park
      # the event in SQS so no object is silently left unarchived.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 21600
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedEventsQueue.Arn
      Environment:
        Variables:
          SOURCE_PREFIX: !Ref SourcePrefix
          ARCHIVE_PREFIX: !Ref ArchivePrefix
          COMPRESSION_LEVEL: !Ref CompressionLevel
          ARCHIVE_STORAGE_CLASS: !Ref ArchiveStorageClass
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Sid: ArchiveObjects
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
                - s3:PutObject
                - s3:AbortMultipartUpload
                - s3:DeleteObject
                - s3:DeleteObjectVersion
              Resource: !Sub arn:${AWS::Partition}:s3:::${AWS::StackName}-${AWS::AccountId}-${AWS::Region}/*
      Events:
        ObjectCreated:
          Type: S3
          Properties:
            Bucket: !Ref ArchiveBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: !Ref SourcePrefix
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./src/archiver
      DockerTag: nodejs24

  # ---------------------------------------------------------------------------
  # Operations
  # ---------------------------------------------------------------------------
  ArchiverLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-archiver
      RetentionInDays: !Ref LogRetentionInDays

  FailedEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600 # 14 days, the maximum
      SqsManagedSseEnabled: true

  FailedEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: S3 events failed to archive after all retries. Inspect the queue and replay.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FailedEventsQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmTopic, [!Ref AlarmTopicArn], !Ref AWS::NoValue]

Outputs:
  BucketName:
    Description: Bucket to upload files to (under the source prefix)
    Value: !Ref ArchiveBucket
  UploadLocation:
    Description: Objects uploaded here are archived automatically
    Value: !Sub s3://${ArchiveBucket}/${SourcePrefix}
  ArchiveLocation:
    Description: Where the ZIP archives are written
    Value: !Sub s3://${ArchiveBucket}/${ArchivePrefix}
  ArchiverFunctionName:
    Value: !Ref ArchiverFunction
  ArchiverFunctionAliasArn:
    Description: Alias invoked by the S3 trigger
    Value: !Ref ArchiverFunction.Alias
  ArchiverFunctionVersionArn:
    Description: Version published by this deployment
    Value: !Ref ArchiverFunction.Version
  FailedEventsQueueUrl:
    Description: Events that could not be archived after all retries
    Value: !Ref FailedEventsQueue
  LogGroupName:
    Value: !Ref ArchiverLogGroup
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
